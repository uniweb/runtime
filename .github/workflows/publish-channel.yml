# Publish the runtime distribution channel to GitHub Pages.
#
#   https://<owner>.github.io/<repo>/runtime/index.json      what exists · latest · deprecated
#   https://<owner>.github.io/<repo>/runtime/<version>/…     the artifacts
#
# ── It publishes what npm SHIPPED, not what this tree builds ──
#
# This package declares `@uniweb/core: workspace:*`, so a standalone clone of
# this repo cannot install or build at all — it is a workspace member, and only
# the monorepo can build it. A build-from-source workflow is therefore not
# merely awkward here; it is impossible.
#
# Publishing the npm tarball is better than a workaround for that. The channel
# then carries **exactly the bytes a customer installs**, so "the runtime a site
# gets" and "the runtime in the channel" are the same artifact by construction
# rather than by two builds happening to agree. Measured while building this:
# npm's 0.9.7 and a local 0.9.7 fingerprint DIFFERENTLY, because a build flag
# moved between them — a version number does not determine its bytes, which is
# exactly why the index records `integrity` rather than assuming it.
#
# A consequence worth knowing: this job needs no package manager, no install and
# no build. `publish-channel.mjs` is dependency-free Node by design, and that
# choice is what lets this run on nothing but `npm pack` + node.
#
# ── Why the index is written last ──
#
# A consumer polls the index; the moment it names a version it fetches that
# version's files. `publish-channel.mjs` stages the artifacts and renames them
# into place, then writes the index as its final act, and this workflow ships
# both in ONE commit so the tree never exists half-published.
#
# ⚠️ What this cannot give you: cache headers. GitHub Pages serves everything
# `Cache-Control: max-age=600` and allows no per-file headers — measured. So the
# index is cached up to 10 minutes (with an ETag, so revalidation is cheap) and
# `<version>/**` is not marked immutable even though it is. A consumer needing
# `no-cache` on the index must re-serve this channel from a host where headers
# are settable; that is a property of Pages, not of the channel format.

name: Publish runtime channel

on:
  # A release tag is the real signal, and it is SAFE to trigger on because of
  # the order the publish script uses:
  #
  #   pnpm version <bump>   → version commit + tag, locally
  #   pnpm publish          → npm
  #   git push --tags       → the tag reaches GitHub LAST
  #
  # So by the time a tag lands here, npm already has the version — no race
  # between the trigger and the thing it fetches.
  push:
    tags: ['v*']

  # A safety net, not the mechanism. A tag run that fails (or a version
  # published without one) would otherwise leave the channel stale forever.
  # Daily rather than hourly now that tags carry the signal; the job is
  # idempotent, so a redundant run is a fast no-op.
  schedule:
    - cron: '17 6 * * *'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (default: npm latest)'
        required: false
        default: 'latest'

permissions:
  contents: write # pushes to the gh-pages branch

# Never two publishes at once: both would read the same index, and the second
# would overwrite the first's entry rather than appending to it.
concurrency:
  group: publish-runtime-channel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Only for `scripts/publish-channel.mjs` — none of this repo's source is
      # published by this job.
      - name: Check out the publisher
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the published package from npm
        run: |
          VERSION="${{ github.event.inputs.version || 'latest' }}"
          mkdir -p .npmpkg && cd .npmpkg
          npm pack "@uniweb/runtime@${VERSION}" --silent
          tar -xzf ./*.tgz
          node -p "'Fetched ' + require('./package/package.json').name + '@' + require('./package/package.json').version"

      # A separate checkout of the served branch, created on first run.
      - name: Check out the channel branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            # `actions/checkout` fetches only the ref that triggered the run, so
            # the branch exists on the remote but has no local ref — fetch it
            # explicitly rather than assuming a full clone. (`-B` points a local
            # gh-pages at the remote tip so the later `git push origin gh-pages`
            # has a branch to push, rather than a detached HEAD.)
            git fetch --depth=1 origin gh-pages
            git worktree add -B gh-pages .channel origin/gh-pages
          else
            git worktree add --detach .channel
            cd .channel
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            # Pages would otherwise run Jekyll and drop paths beginning with _
            # — which is every `_importmap/` file in the browser half.
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialise the runtime channel"
          fi

      # Idempotent on purpose: a redundant run on an unchanged version is a no-op,
      # while a human republishing one is still refused.
      - name: Publish into the channel
        run: |
          node scripts/publish-channel.mjs \
            --channel .channel \
            --from .npmpkg/package \
            --skip-if-published

      # One commit, so the artifacts and the index that names them land
      # together. Nothing to commit means the version was already published.
      - name: Push the channel
        working-directory: .channel
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Channel unchanged — nothing to publish."
            exit 0
          fi
          VERSION=$(node -p "require('../.npmpkg/package/package.json').version")
          git add -A
          git commit -m "runtime ${VERSION}"
          git push origin gh-pages
