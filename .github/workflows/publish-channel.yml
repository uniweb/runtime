# Publish the runtime distribution channel to GitHub Pages.
#
#   https://<owner>.github.io/<repo>/runtime/index.json      what exists · latest · deprecated
#   https://<owner>.github.io/<repo>/runtime/<version>/…     the artifacts
#
# ── It BUILDS the tag. It used to republish the npm tarball ──
#
# The old job ran `npm pack @uniweb/runtime@<version>` and republished the
# tarball's `dist/`, because this package declares its siblings `workspace:*`
# and a standalone clone could not install, let alone build.
#
# `package.standalone.json` + `pnpm-lock.yaml` removed that constraint, and
# building is strictly better here for one reason: the npm tarball is meant to
# stop carrying the delivery set at all. Those ~1.9 MB per version are not
# importable by anything — no `exports` entry reaches them — and they exist in
# the tarball today only because this job used to read them from there.
#
# ⚠️ **A lockfile is not optional for this.** Measured on v0.11.0: pinning the
# five direct dependencies by hand still produced different bytes, because
# `@uniweb/semantic-parser` declares `yaml: ^2.8.2` and a fresh install took
# 2.9.0 where the workspace had 2.8.3 — real code in the SSR isolate bundle.
# Two independent standalone checkouts built from the committed lockfile produce
# 33/33 byte-identical delivery files; without it they do not.
#
# ── What this changes about the publish ordering ──
#
# `scripts/framework/publish.js` (in the development monorepo) documents that
# `git push --tags` MUST come after `pnpm publish`, because this job used to
# fetch the version from npm and would otherwise fire on a version npm did not
# yet serve. **This job no longer touches npm**, so that particular race is
# gone. The ordering may still be load-bearing for other reasons — do not
# relax it on the strength of this comment alone.
#
# ── Why the index is written last ──
#
# A consumer polls the index; the moment it names a version it fetches that
# version's files. `publish-channel.mjs` stages the artifacts and renames them
# into place, then writes the index as its final act, and this workflow ships
# both in ONE commit so the tree never exists half-published.
#
# ⚠️ What this cannot give you: cache headers. GitHub Pages serves everything
# `Cache-Control: max-age=600` and allows no per-file headers — measured. That
# is tolerable because the channel is PULLED BY MIRRORS, never by end users'
# browsers; a consumer that needs `no-cache` on the index, or `immutable` on a
# version, must re-serve this channel from a host where headers are settable.

name: Publish runtime channel

on:
  # A release tag is the real signal.
  push:
    tags: ['v*']

  # A safety net, not the mechanism. A tag run that fails would otherwise leave
  # the channel stale until someone noticed. The job is idempotent — a tag that
  # is already published exits before it builds anything — so a redundant run is
  # a fast no-op rather than wasted minutes.
  schedule:
    - cron: '17 6 * * *'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.11.0 (default: the latest tag)'
        required: false
        default: 'latest'

permissions:
  contents: write # pushes to the gh-pages branch

# Never two publishes at once: both would read the same index, and the second
# would overwrite the first's entry rather than appending to it.
concurrency:
  group: publish-runtime-channel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history: the tag has to be resolvable, and the scheduled run needs
      # to find the latest one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag to build
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            IN="${{ github.event.inputs.version }}"
            if [ -n "$IN" ] && [ "$IN" != "latest" ]; then
              TAG="v${IN#v}"
            else
              TAG="$(git describe --tags --abbrev=0 --match 'v*')"
            fi
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::No such tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      # The served branch, checked out as a worktree. Created on first run.
      - name: Check out the channel branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add -B gh-pages .channel origin/gh-pages
          else
            git worktree add --detach .channel
            cd .channel
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            # Pages would otherwise run Jekyll and drop paths beginning with _
            # — which is every `_importmap/` file in the browser half.
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialise the runtime channel"
          fi

      # ⭐ BEFORE building, not after. A version is immutable, so a tag already
      # in the index can never produce anything new — and checking first is what
      # keeps the daily cron a few seconds instead of a full toolchain install
      # and three builds. It is also what lets this job run against tags that
      # predate the standalone manifest: they are already published, so it exits
      # here rather than failing at a step their tree has no script for.
      - name: Skip if this version is already in the channel
        id: gate
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          VERSION="${TAG#v}"
          INDEX=.channel/runtime/index.json
          if [ -f "$INDEX" ] && node -e "
                const i = require('./$INDEX');
                process.exit(i.versions && i.versions['$VERSION'] ? 0 : 1);
              "; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already published — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag
        if: steps.gate.outputs.already == 'false'
        run: git checkout --detach "${{ steps.ref.outputs.tag }}"

      # A tag whose package.json disagrees with its own name would publish under
      # the wrong version — immutably. Cheap to check, impossible to undo.
      - name: Verify the tag names the version it builds
        if: steps.gate.outputs.already == 'false'
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ "v$V" != "${{ steps.ref.outputs.tag }}" ]; then
            echo "::error::Tag ${{ steps.ref.outputs.tag }} contains package.json version $V"
            exit 1
          fi

      # Both pinned. pnpm's version comes from package.json#packageManager, so
      # it is pinned in exactly one place; a floating toolchain is the same
      # class of drift as a floating dependency, one layer up.
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.already == 'false'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.already == 'false'
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # This package is a workspace member: its `@uniweb/*` deps are
      # `workspace:*`, which no registry understands. The twin is that manifest
      # with them resolved, generated in the workspace and committed beside a
      # lockfile derived from it.
      - name: Use the standalone manifest
        if: steps.gate.outputs.already == 'false'
        run: node scripts/standalone-manifest.js --apply

      # --frozen-lockfile is the point of this step: it fails when the manifest
      # and the lockfile disagree, rather than silently re-resolving and
      # building bytes nobody has ever run.
      - name: Install (frozen)
        if: steps.gate.outputs.already == 'false'
        run: pnpm install --frozen-lockfile

      # A version publishes both halves or neither — `publish-channel.mjs`
      # refuses an incomplete set, but failing here names which build broke.
      - name: Build every delivery flavor
        if: steps.gate.outputs.already == 'false'
        run: |
          pnpm build
          pnpm build:worker

      # `--from` defaults to the repo root, which is what we just built into.
      # `--skip-if-published` stays as a second guard: the gate above reads the
      # index, this reads the directory, and a channel where those disagree is
      # worse than either failure alone.
      - name: Publish into the channel
        if: steps.gate.outputs.already == 'false'
        run: node scripts/publish-channel.mjs --channel .channel --skip-if-published

      # One commit, so the artifacts and the index that names them land
      # together.
      - name: Push the channel
        if: steps.gate.outputs.already == 'false'
        working-directory: .channel
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Built ${{ steps.ref.outputs.tag }} but the channel is unchanged."
            echo "The gate said this version was absent, so producing nothing is a fault, not a no-op."
            exit 1
          fi
          git add -A
          git commit -m "runtime ${{ steps.ref.outputs.tag }}"
          git push origin gh-pages
